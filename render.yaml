services:
  - type: web
    name: telegram-face-swap
    runtime: python
    plan: free
    buildCommand: |
      apt-get update &&
      apt-get install -y --no-install-recommends ffmpeg &&
      rm -rf /var/lib/apt/lists/* &&
      pip install --upgrade pip &&
      pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
